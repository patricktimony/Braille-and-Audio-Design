<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>SimpleGit</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="topbar">
    <div class="wrap topbar-inner">
      <p class="brand"><span aria-hidden="true">🌱</span> SimpleGit</p>
      <nav class="nav" aria-label="Go back or go home">
        <button type="button" id="back-button" class="btn nav-btn"><span aria-hidden="true">←</span> Back</button>
        <a id="home-button" class="btn nav-btn" href="#/"><span aria-hidden="true">⌂</span> Home</a>
      </nav>
    </div>
  </header>

  <section id="speech-bar" class="speech-bar" aria-label="Spoken help" hidden>
    <div class="wrap speech-inner">
      <button type="button" id="speech-toggle" class="btn small-btn" aria-pressed="false">Spoken help: Off</button>
      <button type="button" id="speech-repeat" class="btn small-btn">Repeat Instruction</button>
      <button type="button" id="speech-stop" class="btn small-btn">Stop Speaking</button>
    </div>
  </section>

  <main id="main" class="wrap" tabindex="-1">
    <div id="view">
      <p class="loading">Loading SimpleGit…</p>
      <noscript><p class="status error"><strong>JavaScript is turned off.</strong> SimpleGit needs JavaScript to work. Please turn it on in your browser settings.</p></noscript>
    </div>
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <p id="signed-in-as"></p>
      <a href="#/help" class="footer-link">Help</a>
      <button type="button" id="sign-out" class="btn small-btn" hidden>Sign Out</button>
    </div>
  </footer>

  <!-- Screen reader announcements -->
  <div id="announce-polite" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
  <div id="announce-assertive" class="visually-hidden" aria-live="assertive" aria-atomic="true"></div>

  <dialog id="dialog" aria-labelledby="dialog-title" aria-describedby="dialog-message">
    <h2 id="dialog-title"></h2>
    <div id="dialog-message"></div>
    <div id="dialog-buttons" class="button-row"></div>
  </dialog>
</body>
</html>
