# One-click hosting for social-mirror/ on Render (https://render.com).
# Render → New → Blueprint → pick this repo. It will ask for the three secret values below.
# Reddit is optional: add REDDIT_CLIENT_ID / REDDIT_CLIENT_SECRET / REDDIT_USER_AGENT later under the
# service's Environment tab.
services:
  - type: web
    name: social-mirror
    runtime: node
    rootDir: social-mirror
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node server/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_PASSWORD
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
