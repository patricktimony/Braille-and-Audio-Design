name: Talking Scanner (Windows)

on:
  push:
    paths: ["talking-scanner/**", ".github/workflows/talking-scanner-windows.yml"]
  pull_request:
    paths: ["talking-scanner/**", ".github/workflows/talking-scanner-windows.yml"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: talking-scanner
    env:
      TESSERACT_CMD: C:\Program Files\Tesseract-OCR\tesseract.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tesseract OCR
        run: choco install tesseract -y --no-progress
      - name: Install Python packages
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit and integration tests (OCR, navigation, SAPI speech)
        run: python -m pytest -v
      - name: Keyboard test with real Windows key events (Num Lock on and off)
        run: python tools/windows_key_test.py
      - name: Diagnostics (WIA, TWAIN, voices, Narrator)
        if: always()
        run: python -m talking_scanner --diagnose
      - name: Build Windows executable
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name TalkingScanner --hidden-import win32timezone launcher.py
          robocopy "C:\Program Files\Tesseract-OCR" dist\TalkingScanner\tesseract /E /NFL /NDL /NJH /NJS; if ($LASTEXITCODE -le 7) { $global:LASTEXITCODE = 0 }
          Copy-Item README.md dist\TalkingScanner\
      - name: Executable smoke test (bundled Tesseract, WIA)
        run: |
          $env:TESSERACT_CMD = ""
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notlike '*Tesseract*' }) -join ';'
          Rename-Item "C:\Program Files\Tesseract-OCR" "Tesseract-OCR-hidden"
          $p = Start-Process dist\TalkingScanner\TalkingScanner.exe -ArgumentList "--diagnose" -Wait -PassThru
          Rename-Item "C:\Program Files\Tesseract-OCR-hidden" "Tesseract-OCR"
          Get-Content "$env:LOCALAPPDATA\TalkingScanner\diagnostics.txt"
          if ($p.ExitCode -ne 0) { exit 1 }
          if (-not (Select-String -Path "$env:LOCALAPPDATA\TalkingScanner\diagnostics.txt" -Pattern "TalkingScanner\\tesseract")) { throw "bundled Tesseract not used" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TalkingScanner-windows
          path: |
            talking-scanner/dist/TalkingScanner
            talking-scanner/key_test_results.json
