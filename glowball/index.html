<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000">
<title>Glow Ball</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; }
  #start { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 72vw; max-width: 340px; padding: 34px 0; border: 0; border-radius: 999px;
    font: 700 34px -apple-system, system-ui, sans-serif; color: #000; background: #fff;
    box-shadow: 0 0 40px #0ff, 0 0 90px #f0f; cursor: pointer; }
  #msg { position: fixed; left: 16px; right: 16px; bottom: 40px; text-align: center;
    font: 16px -apple-system, system-ui, sans-serif; color: #888; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="start">Start</button>
<div id="msg"></div>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
const btn = document.getElementById('start'), msg = document.getElementById('msg');
let W, H, dpr;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  c.width = W * dpr; c.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize); resize();

// Sensor state: gravity in m/s^2 (screen x right, y down), tilt in degrees
let gx = 0, gy = 9.8, gamma = 0;

function onMotion(e) {
  const a = e.accelerationIncludingGravity;
  if (!a || a.x == null) return;
  // Rotate device axes into current screen axes
  const ang = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  if (ang === 90)                      { gx = -a.y; gy = -a.x; }
  else if (ang === -90 || ang === 270) { gx = a.y;  gy = a.x; }
  else if (ang === 180)                { gx = -a.x; gy = a.y; }
  else                                 { gx = a.x;  gy = -a.y; }
}
function onOrient(e) {
  if (e.gamma != null) gamma = e.gamma;
}

// Ball
const ball = { x: 0, y: 0, vx: 0, vy: 0, r: 31, hue: 180 }; // 62 CSS px ≈ 1 cm on iPhone screens
const PX_PER_G = 260;      // pixels/s^2 per m/s^2 — snappy
const BOUNCE = 0.82;

// Bell fixed in the middle of the screen: the ball bounces off it and rings it
const bell = { r: 30, swing: 0, swingV: 0, lastRing: 0 };

function step(dt) {
  // Color from left/right tilt (smoothed)
  const targetHue = ((gamma + 90) / 180) * 360;
  ball.hue += (targetHue - ball.hue) * Math.min(1, dt * 10);

  ball.vx += gx * PX_PER_G * dt;
  ball.vy += gy * PX_PER_G * dt;
  const drag = Math.pow(0.6, dt); // gentle air drag, keeps inertia
  ball.vx *= drag; ball.vy *= drag;
  ball.x += ball.vx * dt; ball.y += ball.vy * dt;

  const r = ball.r;
  if (ball.x < r)     { ball.x = r;     ball.vx = Math.abs(ball.vx) * BOUNCE; }
  if (ball.x > W - r) { ball.x = W - r; ball.vx = -Math.abs(ball.vx) * BOUNCE; }
  if (ball.y < r)     { ball.y = r;     ball.vy = Math.abs(ball.vy) * BOUNCE; }
  if (ball.y > H - r) { ball.y = H - r; ball.vy = -Math.abs(ball.vy) * BOUNCE; }

  // Ball vs bell (treated as a circle at screen center)
  const dx = ball.x - W / 2, dy = ball.y - H / 2, d = Math.hypot(dx, dy) || 1, minD = r + bell.r;
  if (d < minD) {
    const nx = dx / d, ny = dy / d, vn = ball.vx * nx + ball.vy * ny;
    ball.x = W / 2 + nx * minD; ball.y = H / 2 + ny * minD;
    if (vn < 0) {
      ball.vx -= (1 + BOUNCE) * vn * nx; ball.vy -= (1 + BOUNCE) * vn * ny;
      bell.swingV += -vn * nx * 0.004;
      ringBell(Math.min(1, -vn / 900));
    }
  }
  // Damped swing of the bell
  bell.swingV += -bell.swing * 120 * dt; bell.swingV *= Math.pow(0.15, dt);
  bell.swing += bell.swingV * dt * 60;
}

function drawBell() {
  const cx = W / 2, cy = H / 2, s = bell.r;
  ctx.save();
  ctx.translate(cx, cy - s * 0.9); ctx.rotate(Math.max(-0.6, Math.min(0.6, bell.swing))); ctx.translate(0, s * 0.9);
  ctx.shadowColor = 'rgba(255,200,80,0.9)'; ctx.shadowBlur = 18;
  const g = ctx.createLinearGradient(-s, 0, s, 0);
  g.addColorStop(0, '#a8741a'); g.addColorStop(0.4, '#ffe08a'); g.addColorStop(1, '#b98320');
  ctx.fillStyle = g;
  ctx.beginPath();                                   // bell body
  ctx.moveTo(-s * 0.95, s * 0.6);
  ctx.quadraticCurveTo(-s * 0.7, s * 0.4, -s * 0.6, -s * 0.2);
  ctx.quadraticCurveTo(-s * 0.55, -s * 0.85, 0, -s * 0.85);
  ctx.quadraticCurveTo(s * 0.55, -s * 0.85, s * 0.6, -s * 0.2);
  ctx.quadraticCurveTo(s * 0.7, s * 0.4, s * 0.95, s * 0.6);
  ctx.closePath(); ctx.fill();
  ctx.fillRect(-s, s * 0.55, s * 2, s * 0.14);       // rim
  ctx.beginPath(); ctx.arc(0, -s * 0.95, s * 0.14, 0, Math.PI * 2); ctx.fill(); // top loop
  ctx.beginPath(); ctx.arc(0, s * 0.8, s * 0.16, 0, Math.PI * 2); ctx.fill();   // clapper
  ctx.restore();
}

function draw() {
  // Fade previous frame for a light glowing trail
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.fillRect(0, 0, W, H);
  drawBell();

  const { x, y, r, hue } = ball, h = hue.toFixed(0);
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * 3);
  g.addColorStop(0, `hsla(${h},100%,65%,0.9)`);
  g.addColorStop(0.33, `hsla(${h},100%,55%,0.35)`);
  g.addColorStop(1, `hsla(${h},100%,50%,0)`);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r * 3, 0, Math.PI * 2); ctx.fill();

  ctx.globalCompositeOperation = 'source-over';
  const core = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, 0, x, y, r);
  core.addColorStop(0, `hsl(${h},100%,92%)`);
  core.addColorStop(0.45, `hsl(${h},100%,68%)`);
  core.addColorStop(1, `hsl(${h},100%,55%)`);
  ctx.fillStyle = core;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}

// Sound: vertical position -> pitch, horizontal -> tone; both high at screen middle, low at edges
let audio = null;
function startAudio() {
  // Play even when the iPhone ring/silent switch is on silent (Safari 16.4+)
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ac.createOscillator(), filter = ac.createBiquadFilter(), gain = ac.createGain();
  osc.type = 'sawtooth';
  filter.type = 'lowpass'; filter.Q.value = 6;
  gain.gain.value = 0.18;
  osc.connect(filter).connect(gain).connect(ac.destination);
  osc.start();
  ac.resume();
  audio = { ac, osc, filter };
}
function ringBell(strength) {
  if (!audio || strength < 0.03) return;
  const { ac } = audio, now = ac.currentTime;
  if (now - bell.lastRing < 0.08) return;
  bell.lastRing = now;
  // Inharmonic partials with long decays = bell
  [[1, 1, 3], [2.0, 0.6, 2], [2.76, 0.45, 1.4], [5.4, 0.25, 0.8], [8.9, 0.12, 0.5]].forEach(([ratio, amp, decay]) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = 660 * ratio;
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.35 * amp * (0.3 + 0.7 * strength), now + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, now + decay);
    o.connect(g).connect(ac.destination);
    o.start(now); o.stop(now + decay + 0.05);
  });
}
function updateAudio() {
  if (!audio) return;
  const { ac, osc, filter } = audio, now = ac.currentTime;
  // 1 at the middle of the screen, 0 at the edges
  const midY = 1 - Math.abs(2 * Math.max(0, Math.min(1, (ball.y - ball.r) / (H - 2 * ball.r))) - 1);
  const midX = 1 - Math.abs(2 * Math.max(0, Math.min(1, (ball.x - ball.r) / (W - 2 * ball.r))) - 1);
  osc.frequency.setTargetAtTime(110 * Math.pow(2, midY * 3), now, 0.02);      // 110–880 Hz
  filter.frequency.setTargetAtTime(200 * Math.pow(2, midX * 5.5), now, 0.02); // ~200–9000 Hz
}

let last = 0;
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000 || 0);
  last = now;
  step(dt); draw(); updateAudio();
  requestAnimationFrame(loop);
}

btn.addEventListener('click', () => {
  const DM = window.DeviceMotionEvent, DO = window.DeviceOrientationEvent;
  // iOS needs both permission requests started directly inside the tap
  startAudio(); // must start inside the tap for iOS
  const reqs = [];
  if (DM && typeof DM.requestPermission === 'function') reqs.push(DM.requestPermission());
  if (DO && typeof DO.requestPermission === 'function') reqs.push(DO.requestPermission());
  Promise.all(reqs).then(results => {
    if (results.some(r => r !== 'granted')) {
      msg.textContent = 'Motion access was denied. Close Safari tab and reopen the link to try again.';
      return;
    }
    addEventListener('devicemotion', onMotion);
    addEventListener('deviceorientation', onOrient);
    btn.remove();
    ball.x = W / 2; ball.y = H * 0.2;
    requestAnimationFrame(loop);
  }).catch(err => {
    msg.textContent = 'Could not get motion access: ' + err.message + (location.protocol !== 'https:' ? ' (page must be HTTPS)' : '');
  });
});
</script>
</body>
</html>
