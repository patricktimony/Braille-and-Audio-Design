<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Treebook</title>
  <meta name="description" content="Treebook: a social network for individual trees. Follow trees near you and post what you notice.">
  <meta name="theme-color" content="#1f6b3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Treebook">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip-link" href="#main" data-action="skip">Skip to content</a>

  <header class="topbar">
    <a href="#/" class="brand" aria-label="Treebook, home"><span aria-hidden="true">🌳</span> treebook</a>
  </header>

  <main id="main" tabindex="-1">
    <noscript><p class="card">Treebook needs JavaScript turned on in Safari settings.</p></noscript>
  </main>

  <nav class="tabbar" aria-label="Main">
    <a href="#/" data-tab="feed"><span class="ico" aria-hidden="true">🏠</span><span>Feed</span></a>
    <a href="#/nearby" data-tab="nearby"><span class="ico" aria-hidden="true">📍</span><span>Nearby</span></a>
    <a href="#/map" data-tab="map"><span class="ico" aria-hidden="true">🗺️</span><span>Map</span></a>
    <a href="#/add" data-tab="add"><span class="ico" aria-hidden="true">➕</span><span>Add tree</span></a>
    <a href="#/me" data-tab="me"><span class="ico" aria-hidden="true">👤</span><span>You</span></a>
  </nav>

  <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
  <div id="toast" class="toast" aria-hidden="true"></div>

  <dialog id="lightbox" aria-labelledby="lightbox-caption">
    <figure>
      <img id="lightbox-img" alt="">
      <figcaption id="lightbox-caption"></figcaption>
    </figure>
    <form method="dialog"><button class="btn btn-primary" value="close">Close photo</button></form>
  </dialog>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/data.js"></script>
  <script src="js/art.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
